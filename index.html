<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message Template</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306C755'/%3E%3Cpath d='M14 22c0-4.4 3.6-8 8-8h20c4.4 0 8 3.6 8 8v10c0 4.4-3.6 8-8 8H28l-9.5 7.2c-.9.7-2.2 0-2.2-1.1V40c-1.4-1.4-2.3-3.4-2.3-5.6V22z' fill='white'/%3E%3Crect x='19' y='19' width='19' height='3.4' rx='1.7' fill='%2306C755'/%3E%3Crect x='19' y='25' width='26' height='3.4' rx='1.7' fill='%2306C755'/%3E%3Crect x='19' y='31' width='14' height='3.4' rx='1.7' fill='%2306C755'/%3E%3C/svg%3E">
<style>
  :root {
    --accent: #06C755;
    --accent-dark: #04A648;
    --bubble-bg: #A6E6A1;
    --paper: #F7F5F0;
    --ink: #23291F;
    --ink-soft: #5C6357;
    --line-gray: #D9DED3;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Segoe UI', 'Noto Sans Thai', 'Sarabun', system-ui, sans-serif;
    padding: 32px 20px 60px;
  }
  .wrap {
    max-width: 1160px;
    margin: 0 auto;
  }
  header {
    margin-bottom: 28px;
  }
  header .tag {
    display: inline-block;
    background: var(--accent);
    color: white;
    font-size: 13px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  header p {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0;
    max-width: 60ch;
  }
  .grid {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.1fr) minmax(0, 0.8fr);
    justify-content: center;
    gap: 24px;
  }
  @media (max-width: 1150px) {
    .grid { grid-template-columns: 1fr 1fr; justify-content: stretch; }
    .log-panel { grid-column: 1 / -1; }
  }
  @media (max-width: 760px) {
    .grid { grid-template-columns: 1fr; }
    .log-panel { grid-column: auto; }
  }
  .panel {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid #E7E4DB;
    min-width: 0;
  }
  .field {
    margin-bottom: 18px;
  }
  .field:last-child { margin-bottom: 0; }
  label {
    display: block;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 6px;
  }
  label .hint {
    font-weight: 400;
    color: var(--ink-soft);
    font-size: 12.5px;
  }
  input[type="text"], textarea, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--line-gray);
    font-size: 14.5px;
    font-family: inherit;
    background: #FCFBF8;
    color: var(--ink);
    transition: border-color .15s ease;
  }
  input[type="text"]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea {
    resize: vertical;
    min-height: 90px;
    line-height: 1.6;
  }
  .divider {
    border: none;
    border-top: 1px solid #EDEAE0;
    margin: 20px 0;
  }
  .save-btn {
    background: #EFFBF1;
    color: var(--accent-dark);
    border: 1.5px solid var(--accent);
    border-radius: 10px;
    padding: 9px 14px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .save-btn:hover { background: #DFF6E3; }
  .save-status {
    font-size: 12.5px;
    color: var(--accent-dark);
    margin-top: 6px;
    min-height: 16px;
  }

  /* Preset section */
  .preset-section {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
  }
  .preset-section > label {
    margin-bottom: 8px;
  }
  .preset-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .preset-row select { flex: 1; min-width: 0; }
  .icon-btn {
    flex-shrink: 0;
    background: #FCFBF8;
    border: 1.5px solid var(--line-gray);
    border-radius: 8px;
    width: 38px;
    font-size: 15px;
    cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--accent); background: #EFFBF1; }
  .icon-btn.danger {
    background: #FCEEEE;
    border-color: #EFC6C6;
    color: #C43E3E;
  }
  .icon-btn.danger:hover { background: #F8DADA; }
  .preset-save-row {
    display: flex;
    gap: 8px;
  }
  .preset-save-row input { flex: 1; min-width: 0; }
  .backup-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .backup-row .save-btn {
    flex: 1;
    min-width: 0;
    text-align: center;
    white-space: normal;
    line-height: 1.3;
    padding: 8px 6px;
    font-size: 12px;
  }

  /* Dynamic link list */
  .link-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .link-key {
    flex-shrink: 0;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent-dark);
    background: #EFFBF1;
    border: 1px solid var(--accent);
    border-radius: 7px;
    padding: 8px 8px;
    min-width: 52px;
    text-align: center;
    font-family: 'Consolas', monospace;
  }
  .link-row input[type="text"] {
    flex: 1;
  }
  .remove-btn {
    flex-shrink: 0;
    background: #FCEEEE;
    color: #C43E3E;
    border: 1.5px solid #EFC6C6;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    line-height: 1;
  }
  .remove-btn:hover { background: #F8DADA; }
  .add-btn {
    background: none;
    border: 1.5px dashed var(--line-gray);
    color: var(--ink-soft);
    border-radius: 10px;
    padding: 10px;
    width: 100%;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 2px;
  }
  .add-btn:hover {
    border-color: var(--accent);
    color: var(--accent-dark);
    background: #EFFBF1;
  }

  /* Preview side */
  .preview-panel {
    background: #E9EDE3;
    border-radius: 16px;
    padding: 24px 20px;
    border: 1px solid #E7E4DB;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .preview-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    min-height: 220px;
  }
  .bubble {
    background: var(--bubble-bg);
    border-radius: 14px 14px 4px 14px;
    padding: 14px 16px;
    max-width: 90%;
    align-self: flex-end;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 14.5px;
    line-height: 1.65;
    color: #1B2A17;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .copy-btn {
    margin-top: 16px;
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s ease;
  }
  .copy-btn:hover { background: var(--accent-dark); }
  .copy-btn.copied { background: #3D8B5F; }
  .footnote {
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 10px;
    text-align: center;
  }

  /* Confirm modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(35, 41, 31, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
  }
  .modal-overlay.open { display: flex; }
  .modal-card {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    max-width: 380px;
    width: 100%;
    border: 1px solid #E7E4DB;
    box-shadow: 0 12px 32px rgba(0,0,0,0.18);
  }
  .modal-title {
    font-size: 16.5px;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 8px;
  }
  .modal-message {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.6;
    margin: 0 0 20px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-btn {
    flex: 1;
    border-radius: 10px;
    padding: 11px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid var(--line-gray);
    background: #FCFBF8;
    color: var(--ink);
  }
  .modal-btn:hover { background: #F1EEE5; }
  .modal-btn.danger {
    background: #E5484D;
    border-color: #C43E3E;
    color: white;
  }
  .modal-btn.danger:hover { background: #C43E3E; }

  /* Post log panel */
  .log-panel {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    border: 1px solid #E7E4DB;
    min-width: 0;
  }
  .log-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .log-title {
    font-size: 14.5px;
    font-weight: 700;
    color: var(--ink);
  }
  .log-title .hint {
    display: block;
    font-weight: 400;
    margin-top: 2px;
  }
  .log-settings {
    display: none;
    background: #FCFBF8;
    border: 1px solid var(--line-gray);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .log-settings.open { display: block; }
  .log-settings label {
    font-size: 12.5px;
    margin-bottom: 6px;
  }
  .log-list {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 420px;
    overflow-y: auto;
  }
  .log-empty {
    font-size: 13px;
    color: var(--ink-soft);
    text-align: center;
    padding: 20px 10px;
    line-height: 1.6;
  }
  .log-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid var(--line-gray);
    border-radius: 10px;
    background: #FCFBF8;
  }
  .log-info { flex: 1; min-width: 0; }
  .log-time {
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-bottom: 2px;
  }
  .log-link-row {
    font-size: 13px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .log-platform-label {
    font-weight: 700;
    color: var(--accent-dark);
  }
  .log-copy-btn {
    flex-shrink: 0;
    background: #EFFBF1;
    color: var(--accent-dark);
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .log-copy-btn:hover { background: #DFF6E3; }
  .log-copy-btn.copied { background: #3D8B5F; color: white; border-color: #3D8B5F; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="tag">MESSAGE TEMPLATE</span>
    <h1>ตัวสร้างข้อความ</h1>
    <p>เพิ่ม/ลบรายการข้อมูลได้ตามต้องการ กำหนดเองใน Template ว่าจะเอา {msg1}, {msg2}, ... ไปวางตรงไหน แล้วบันทึกเป็น Preset ไว้ใช้ซ้ำได้</p>
  </header>

  <div class="grid">
    <div class="panel">
      <div class="preset-section preset-section--top">
        <label>Preset <span class="hint">สลับ Format ที่บันทึกไว้ได้จาก dropdown</span></label>
        <div class="preset-row">
          <select id="presetSelect"></select>
          <button class="icon-btn" id="movePresetUpBtn" type="button" title="ย้ายขึ้น">⬆️</button>
          <button class="icon-btn" id="movePresetDownBtn" type="button" title="ย้ายลง">⬇️</button>
          <button class="icon-btn danger" id="deletePresetBtn" type="button" title="ลบ preset นี้">🗑</button>
        </div>
        <div class="preset-save-row">
          <input type="text" id="presetNameInput" placeholder="ชื่อ preset">
          <button class="save-btn" id="renamePresetBtn" type="button">เปลี่ยนชื่อ</button>
        </div>
        <button class="add-btn" id="addPresetBtn" type="button">+ เพิ่ม preset ใหม่</button>
        <div class="backup-row">
          <button class="save-btn" id="exportPresetsBtn" type="button">⬇️ สำรองข้อมูล (ดาวน์โหลด)</button>
          <button class="save-btn" id="importPresetsBtn" type="button">⬆️ กู้คืนข้อมูล (อัปโหลด)</button>
          <input type="file" id="importFileInput" accept="application/json" style="display:none;">
        </div>
        <div class="save-status" id="presetStatus"></div>
      </div>

      <hr class="divider">

      <label style="margin-bottom:10px;">รายการข้อมูล <span class="hint">แต่ละแถวจะได้ key {msg1}, {msg2}, ... ตามลำดับ</span></label>
      <div id="linkList"></div>
      <button class="add-btn" id="addLinkBtn" type="button">+ เพิ่มรายการ</button>

      <hr class="divider">
      <label style="margin-bottom:10px;">⚙️ แก้ไข Format ข้อความ <span class="hint">การแก้ไขจะถูกบันทึกลง preset ที่เลือกอยู่โดยอัตโนมัติ</span></label>
      <div id="templateBox" style="margin-top:10px;">
        <div class="field" style="margin-top:10px;">
          <textarea id="templateInput"></textarea>
        </div>
      </div>
    </div>

    <div class="preview-panel">
      <div class="preview-label">ตัวอย่างข้อความ</div>
      <div class="chat-area">
        <div class="bubble" id="previewBubble"></div>
      </div>
      <button class="copy-btn" id="copyBtn">คัดลอกข้อความ</button>
      <div class="footnote">คัดลอกแล้วไปวางในแอปแชทที่ต้องการ</div>
    </div>

    <div class="log-panel">
      <div class="log-header">
        <div class="log-title">🔔 โพสต์ล่าสุด <span class="hint">เรียงตามเวลาโพสต์ ใหม่สุดอยู่บน</span></div>
        <button class="icon-btn" id="logSettingsBtn" type="button" title="ตั้งค่าการเชื่อมต่อ">⚙️</button>
      </div>

      <div id="logSettingsBox" class="log-settings">
        <label>Worker API URL <span class="hint">ลิงก์ endpoint ของ Cloudflare Worker ที่จะดึงรายการโพสต์</span></label>
        <input type="text" id="logApiUrlInput" placeholder="https://your-worker.your-subdomain.workers.dev/posts">
        <button class="save-btn" id="saveLogApiBtn" type="button" style="margin-top:8px;">บันทึก</button>
      </div>

      <button class="add-btn" id="refreshLogBtn" type="button">🔄 รีเฟรชรายการ</button>
      <div id="logList" class="log-list"></div>
      <div class="save-status" id="logStatus"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmOverlay">
  <div class="modal-card">
    <p class="modal-title" id="confirmTitle">ยืนยันการลบ</p>
    <p class="modal-message" id="confirmMessage"></p>
    <div class="modal-actions">
      <button class="modal-btn" id="confirmCancelBtn" type="button">ยกเลิก</button>
      <button class="modal-btn danger" id="confirmOkBtn" type="button">ลบ</button>
    </div>
  </div>
</div>

<script>
  const linkListEl = document.getElementById('linkList');
  const addLinkBtn = document.getElementById('addLinkBtn');
  const templateInput = document.getElementById('templateInput');
  const preview = document.getElementById('previewBubble');
  const copyBtn = document.getElementById('copyBtn');

  const presetSelect = document.getElementById('presetSelect');
  const movePresetUpBtn = document.getElementById('movePresetUpBtn');
  const movePresetDownBtn = document.getElementById('movePresetDownBtn');
  const deletePresetBtn = document.getElementById('deletePresetBtn');
  const presetNameInput = document.getElementById('presetNameInput');
  const renamePresetBtn = document.getElementById('renamePresetBtn');
  const addPresetBtn = document.getElementById('addPresetBtn');
  const presetStatus = document.getElementById('presetStatus');
  const exportPresetsBtn = document.getElementById('exportPresetsBtn');
  const importPresetsBtn = document.getElementById('importPresetsBtn');
  const importFileInput = document.getElementById('importFileInput');

  const PRESETS_KEY = 'messageGenerator.presetsList';
  const SELECTED_KEY = 'messageGenerator.selectedPresetIndex';
  const DEFAULT_TEMPLATE = 'ตัวอย่างข้อความ\nExample message : {msg1}\nExample message : {msg2}';

  function loadPresets() {
    let presets;
    try {
      presets = JSON.parse(localStorage.getItem(PRESETS_KEY));
    } catch (e) {
      presets = null;
    }
    if (!Array.isArray(presets) || presets.length === 0) {
      presets = [{ name: 'Preset 1', template: DEFAULT_TEMPLATE, rowCount: 2 }];
      localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
    }
    return presets;
  }

  function savePresets() {
    localStorage.setItem(PRESETS_KEY, JSON.stringify(presets));
  }

  let presets = loadPresets();
  let selectedIndex = parseInt(localStorage.getItem(SELECTED_KEY), 10);
  if (isNaN(selectedIndex) || selectedIndex < 0 || selectedIndex >= presets.length) {
    selectedIndex = 0;
  }

  function setSelectedIndex(i) {
    selectedIndex = i;
    localStorage.setItem(SELECTED_KEY, String(i));
  }

  function showStatus(msg) {
    presetStatus.textContent = msg;
    setTimeout(() => { presetStatus.textContent = ''; }, 2500);
  }

  function refreshPresetSelect() {
    presetSelect.innerHTML = '';
    presets.forEach((p, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = p.name;
      presetSelect.appendChild(opt);
    });
    presetSelect.value = selectedIndex;
  }

  function loadSelectedPresetIntoUI() {
    const p = presets[selectedIndex];
    templateInput.value = p.template;
    presetNameInput.value = p.name;
    setRowCount(typeof p.rowCount === 'number' ? p.rowCount : 2);
    render();
  }

  presetSelect.addEventListener('change', () => {
    setSelectedIndex(parseInt(presetSelect.value, 10));
    loadSelectedPresetIntoUI();
  });

  function movePreset(offset) {
    const targetIndex = selectedIndex + offset;
    if (targetIndex < 0 || targetIndex >= presets.length) return;
    const temp = presets[selectedIndex];
    presets[selectedIndex] = presets[targetIndex];
    presets[targetIndex] = temp;
    setSelectedIndex(targetIndex);
    savePresets();
    refreshPresetSelect();
  }

  movePresetUpBtn.addEventListener('click', () => movePreset(-1));
  movePresetDownBtn.addEventListener('click', () => movePreset(1));

  templateInput.addEventListener('input', () => {
    presets[selectedIndex].template = templateInput.value;
    savePresets();
    render();
  });

  renamePresetBtn.addEventListener('click', () => {
    const newName = presetNameInput.value.trim();
    if (!newName) {
      showStatus('กรุณาตั้งชื่อ preset ก่อนบันทึก');
      return;
    }
    const isDuplicate = presets.some((p, i) => i !== selectedIndex && p.name === newName);
    if (isDuplicate) {
      showStatus('ชื่อนี้ถูกใช้แล้ว กรุณาตั้งชื่ออื่น');
      return;
    }
    presets[selectedIndex].name = newName;
    savePresets();
    refreshPresetSelect();
    showStatus('เปลี่ยนชื่อแล้ว ✓');
  });

  addPresetBtn.addEventListener('click', () => {
    let n = presets.length + 1;
    let name = 'Preset ' + n;
    while (presets.some(p => p.name === name)) {
      n++;
      name = 'Preset ' + n;
    }
    presets.push({ name: name, template: DEFAULT_TEMPLATE, rowCount: 2 });
    savePresets();
    setSelectedIndex(presets.length - 1);
    refreshPresetSelect();
    loadSelectedPresetIntoUI();
    showStatus('เพิ่ม preset "' + name + '" แล้ว');
  });

  // ---- Post log panel (reads from a Cloudflare Worker once it's set up) ----
  const logSettingsBtn = document.getElementById('logSettingsBtn');
  const logSettingsBox = document.getElementById('logSettingsBox');
  const logApiUrlInput = document.getElementById('logApiUrlInput');
  const saveLogApiBtn = document.getElementById('saveLogApiBtn');
  const refreshLogBtn = document.getElementById('refreshLogBtn');
  const logListEl = document.getElementById('logList');
  const logStatus = document.getElementById('logStatus');
  const LOG_API_KEY = 'messageGenerator.logApiUrl';

  const savedLogApiUrl = localStorage.getItem(LOG_API_KEY) || '';
  logApiUrlInput.value = savedLogApiUrl;

  function showLogStatus(msg) {
    logStatus.textContent = msg;
    setTimeout(() => { logStatus.textContent = ''; }, 3000);
  }

  logSettingsBtn.addEventListener('click', () => {
    logSettingsBox.classList.toggle('open');
  });

  saveLogApiBtn.addEventListener('click', () => {
    const url = logApiUrlInput.value.trim();
    localStorage.setItem(LOG_API_KEY, url);
    logSettingsBox.classList.remove('open');
    showLogStatus(url ? 'บันทึก URL แล้ว กด "รีเฟรชรายการ" เพื่อดึงข้อมูล' : 'ลบ URL แล้ว');
  });

  function copyToClipboard(text, btnEl) {
    navigator.clipboard.writeText(text).then(() => {
      const original = btnEl.textContent;
      btnEl.textContent = '✓';
      btnEl.classList.add('copied');
      showLogStatus('คัดลอกลิงก์แล้ว วางที่ต้องการได้เลย');
      setTimeout(() => {
        btnEl.textContent = original;
        btnEl.classList.remove('copied');
      }, 1500);
    });
  }

  function formatLogTime(ts) {
    try {
      const d = new Date(ts);
      if (isNaN(d.getTime())) return String(ts);
      return d.toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
    } catch (e) {
      return String(ts);
    }
  }

  const platformLabel = { facebook: 'Facebook', instagram: 'Instagram' };

  function renderLogList(items) {
    logListEl.innerHTML = '';
    if (!items || items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'log-empty';
      empty.textContent = 'ยังไม่มีข้อมูลโพสต์ — เชื่อมต่อ Worker API แล้วกด "รีเฟรชรายการ"';
      logListEl.appendChild(empty);
      return;
    }
    const sorted = [...items].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    sorted.forEach(item => {
      const row = document.createElement('div');
      row.className = 'log-item';

      const info = document.createElement('div');
      info.className = 'log-info';
      const time = document.createElement('div');
      time.className = 'log-time';
      time.textContent = formatLogTime(item.timestamp);
      const linkRow = document.createElement('div');
      linkRow.className = 'log-link-row';
      const label = platformLabel[item.platform];
      if (label) {
        const labelSpan = document.createElement('span');
        labelSpan.className = 'log-platform-label';
        labelSpan.textContent = label + ' : ';
        linkRow.appendChild(labelSpan);
      }
      linkRow.appendChild(document.createTextNode(item.url));
      info.appendChild(time);
      info.appendChild(linkRow);
      row.appendChild(info);

      const copyBtn = document.createElement('button');
      copyBtn.className = 'log-copy-btn';
      copyBtn.type = 'button';
      copyBtn.title = 'คัดลอกลิงก์';
      copyBtn.textContent = '📋';
      copyBtn.addEventListener('click', () => copyToClipboard(item.url, copyBtn));
      row.appendChild(copyBtn);

      logListEl.appendChild(row);
    });
  }

  // Initial empty state
  renderLogList([]);

  refreshLogBtn.addEventListener('click', async () => {
    const url = (localStorage.getItem(LOG_API_KEY) || '').trim();
    if (!url) {
      showLogStatus('ยังไม่ได้ตั้งค่า Worker API URL — กด ⚙️ เพื่อใส่ก่อน');
      return;
    }
    showLogStatus('กำลังดึงข้อมูล...');
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      renderLogList(Array.isArray(data) ? data : []);
      showLogStatus('อัปเดตล่าสุดแล้ว');
    } catch (e) {
      showLogStatus('ดึงข้อมูลไม่สำเร็จ ตรวจสอบ URL หรือลองใหม่อีกครั้ง');
    }
  });

  const confirmOverlay = document.getElementById('confirmOverlay');
  const confirmMessage = document.getElementById('confirmMessage');
  const confirmCancelBtn = document.getElementById('confirmCancelBtn');
  const confirmOkBtn = document.getElementById('confirmOkBtn');

  function showConfirmModal(message) {
    return new Promise(resolve => {
      confirmMessage.textContent = message;
      confirmOverlay.classList.add('open');

      function cleanup(result) {
        confirmOverlay.classList.remove('open');
        confirmOkBtn.removeEventListener('click', onOk);
        confirmCancelBtn.removeEventListener('click', onCancel);
        confirmOverlay.removeEventListener('click', onOverlayClick);
        resolve(result);
      }
      function onOk() { cleanup(true); }
      function onCancel() { cleanup(false); }
      function onOverlayClick(e) {
        if (e.target === confirmOverlay) cleanup(false);
      }

      confirmOkBtn.addEventListener('click', onOk);
      confirmCancelBtn.addEventListener('click', onCancel);
      confirmOverlay.addEventListener('click', onOverlayClick);
    });
  }

  exportPresetsBtn.addEventListener('click', () => {
    const dataStr = JSON.stringify(presets, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'message-template-presets-backup.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showStatus('ดาวน์โหลดไฟล์สำรองข้อมูลแล้ว');
  });

  importPresetsBtn.addEventListener('click', () => {
    importFileInput.value = '';
    importFileInput.click();
  });

  importFileInput.addEventListener('change', () => {
    const file = importFileInput.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let imported;
      try {
        imported = JSON.parse(reader.result);
      } catch (e) {
        showStatus('ไฟล์นี้ไม่ใช่ไฟล์สำรองข้อมูลที่ถูกต้อง');
        return;
      }
      if (!Array.isArray(imported) || imported.some(p => typeof p !== 'object' || typeof p.name !== 'string' || typeof p.template !== 'string')) {
        showStatus('รูปแบบไฟล์ไม่ถูกต้อง');
        return;
      }
      let addedCount = 0;
      imported.forEach(p => {
        let name = p.name;
        let n = 2;
        while (presets.some(existing => existing.name === name)) {
          name = p.name + ' (' + n + ')';
          n++;
        }
        presets.push({ name: name, template: p.template, rowCount: typeof p.rowCount === 'number' ? p.rowCount : 2 });
        addedCount++;
      });
      savePresets();
      refreshPresetSelect();
      showStatus('กู้คืนสำเร็จ เพิ่ม ' + addedCount + ' preset');
    };
    reader.readAsText(file);
  });

  deletePresetBtn.addEventListener('click', async () => {
    if (presets.length <= 1) {
      showStatus('ต้องมี preset อย่างน้อย 1 อัน');
      return;
    }
    const removedName = presets[selectedIndex].name;
    const confirmed = await showConfirmModal('ต้องการลบ preset "' + removedName + '" ใช่หรือไม่? การลบนี้ไม่สามารถย้อนกลับได้');
    if (!confirmed) return;
    presets.splice(selectedIndex, 1);
    savePresets();
    setSelectedIndex(0);
    refreshPresetSelect();
    loadSelectedPresetIntoUI();
    showStatus('ลบ preset "' + removedName + '" แล้ว');
  });

  function persistRowCount() {
    const count = linkListEl.querySelectorAll('.link-row').length;
    if (presets[selectedIndex]) {
      presets[selectedIndex].rowCount = count;
      savePresets();
    }
  }

  function setRowCount(count) {
    linkListEl.innerHTML = '';
    for (let i = 0; i < count; i++) {
      addLinkRow('', false);
    }
  }

  function addLinkRow(value, shouldPersist) {
    const row = document.createElement('div');
    row.className = 'link-row';

    const key = document.createElement('span');
    key.className = 'link-key';
    row.appendChild(key);

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'วางลิงก์หรือข้อความที่นี่';
    input.value = value || '';
    input.addEventListener('input', render);
    row.appendChild(input);

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.type = 'button';
    removeBtn.textContent = '✕';
    removeBtn.addEventListener('click', () => {
      row.remove();
      renumberKeys();
      persistRowCount();
      render();
    });
    row.appendChild(removeBtn);

    linkListEl.appendChild(row);
    renumberKeys();
    if (shouldPersist !== false) {
      persistRowCount();
    }
  }

  function renumberKeys() {
    const rows = linkListEl.querySelectorAll('.link-row');
    rows.forEach((row, i) => {
      row.querySelector('.link-key').textContent = '{msg' + (i + 1) + '}';
    });
  }

  addLinkBtn.addEventListener('click', () => {
    addLinkRow('');
    render();
  });

  function render() {
    let text = templateInput.value;
    const rows = linkListEl.querySelectorAll('.link-row');
    rows.forEach((row, i) => {
      const val = row.querySelector('input[type="text"]').value;
      const placeholder = '{msg' + (i + 1) + '}';
      text = text.split(placeholder).join(val || placeholder);
    });
    preview.textContent = text;
  }

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(preview.textContent).then(() => {
      copyBtn.textContent = 'คัดลอกแล้ว ✓';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'คัดลอกข้อความ';
        copyBtn.classList.remove('copied');
      }, 1500);
    });
  });

  // Row count is restored per-preset inside loadSelectedPresetIntoUI()
  refreshPresetSelect();
  loadSelectedPresetIntoUI();
</script>
</body>
</html>
